[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "bro-openai"
version = "0.1.0"
description = "Openai model recipes, pricing and credentials for bro"
requires-python = ">=3.12"
dependencies = ["bro", "bro-wire-responses"]

[project.optional-dependencies]
client = ["bro-wire-responses[client]"]

[project.entry-points."bro.llm.providers"]
openai = "bro.openai.declaration"

[project.entry-points."bro.credentials"]
openai = "bro.openai.credentials:KIND"

[tool.uv.sources]
bro = { workspace = true }
bro-wire-responses = { workspace = true }

[tool.deptry.package_module_name_map]
bro = ["bro"]
bro-wire-responses = ["bro"]

[tool.deptry.per_rule_ignores]
DEP002 = ["bro-wire-responses"]
DEP003 = ["openai"]

[tool.uv.build-backend]
module-root = ""
module-name = ["bro.openai"]
namespace = true
wheel-exclude = ["**/*_test.py", "**/*_test_helper.py", "**/conftest.py", "**/AGENTS.md", "**/*.egg-info"]
