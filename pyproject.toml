[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "bro"
version = "0.1.0"
description = "framework for agent personas declared once and run in their own sandbox on any harness, any model"
readme = "README.md"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
# what declaring and inspecting a persona costs — every surface that *runs* one is
# pinned by the extra that owns it, including the ones bro imports lazily (mcp, boto3)
dependencies = [
  "pydantic==2.14.1",
  "python-dateutil==2.9.0.post0",
  "python-ulid==4.0.1",
]

[project.optional-dependencies]
aws = [
  "boto3==1.43.114",
]
http = [
  "aiohttp==3.14.5",
]
llm = [
  "openai==3.33.0",
]
runtime = [
  "anyio==4.15.1",
  "jsonschema==4.26.0",
  "mcp==2.3.0",
  "starlette==1.8.0",
  "tree-sitter==0.26.0",
  "tree-sitter-bash==0.25.1",
  "uvicorn==0.54.0",
]
trails-server = [
  "aiohttp==3.14.5",
  "boto3==1.43.114",
]
github = [
  "pyjwt[crypto]==2.15.1",
]

[dependency-groups]
dev = [
  "bro-dev",
  # local/'s member; must stay a group entry — a [project] dependency would ship it
  "bro-local",
  "deptry==0.25.1",
  # starlette.testclient's preferred HTTP client (using httpx 0.x there is deprecated)
  "httpx2==2.13.1",
  "moto==5.2.4",
  "pyright==1.1.414",
  "pytest==9.1.1",
  "pytest-aiohttp==1.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-xdist==3.8.0",
  # a real parser, for the tests that read YAML this repository renders or ships
  "pyyaml==6.0.3",
  "ruff==0.17.1",
  "shellcheck-py==0.11.0.1",
  "types-python-dateutil==2.9.0.20260807",
  "types-pyyaml==6.0.12.20260906",
]

[tool.uv.workspace]
members = ["bench", "dev", "local", "harnesses/native/harness", "harnesses/native/trails", "oops", "ride", "browser", "filetypes", "wires/responses", "wires/messages", "wires/chat"]

[tool.uv.sources]
bro-dev = { workspace = true }
bro-local = { workspace = true }

[project.scripts]
# bro
"artifact" = "bro._entrypoints:bro_artifact"
"brash" = "bro._entrypoints:bro_brash"
"bro-shell-dir" = "bro._entrypoints:bro_shell"
"bro.artifact" = "bro._entrypoints:bro_artifact"
"bro.base.credentials" = "bro._entrypoints:bro_base_credentials"
"bro.base.time-util" = "bro._entrypoints:bro_base_time_util"
"bro.brash" = "bro._entrypoints:bro_brash"
"bro.broker.broxy" = "bro._entrypoints:bro_broker_broxy"
"bro.broker.cli" = "bro._entrypoints:bro_broker_cli"
"bro.llm.usage" = "bro._entrypoints:bro_llm_usage"
"bro.mission" = "bro._entrypoints:bro_mission"
"bro.quest" = "bro._entrypoints:bro_quest"
"bro.runtime.mcp-server" = "bro._entrypoints:bro_runtime_mcp_server"
"bro.shell" = "bro._entrypoints:bro_shell"
"bro.summon" = "bro._entrypoints:bro_summon"
"bro.trails.admin" = "bro._entrypoints:bro_trails_admin"
"bro.trails.rewind" = "bro._entrypoints:bro_trails_rewind"
"bro.trails.server.server" = "bro._entrypoints:bro_trails_server_server"
"bro.watch-beat" = "bro._entrypoints:bro_watch_beat"
"bro.watch-run" = "bro._entrypoints:bro_watch_run"
"broker" = "bro._entrypoints:bro_broker_cli"
"broxy" = "bro._entrypoints:bro_broker_broxy"
"credentials" = "bro._entrypoints:bro_base_credentials"
"mcp-server" = "bro._entrypoints:bro_runtime_mcp_server"
"mission" = "bro._entrypoints:bro_mission"
"quest" = "bro._entrypoints:bro_quest"
"rewind" = "bro._entrypoints:bro_trails_rewind"
"summon" = "bro._entrypoints:bro_summon"
"trails" = "bro._entrypoints:bro_trails_admin"
"trails-server" = "bro._entrypoints:bro_trails_server_server"
"usage" = "bro._entrypoints:bro_llm_usage"
"watch-beat" = "bro._entrypoints:bro_watch_beat"
"watch-run" = "bro._entrypoints:bro_watch_run"

[project.entry-points."bro.session_commands"]
"artifact" = "bro._entrypoints:bro_artifact"
"brash" = "bro._entrypoints:bro_brash"
"broker" = "bro._entrypoints:bro_broker_cli"
"broxy" = "bro._entrypoints:bro_broker_broxy"
"credentials" = "bro._entrypoints:bro_base_credentials"
"mcp-server" = "bro._entrypoints:bro_runtime_mcp_server"
"mission" = "bro._entrypoints:bro_mission"
"quest" = "bro._entrypoints:bro_quest"
"rewind" = "bro._entrypoints:bro_trails_rewind"
"summon" = "bro._entrypoints:bro_summon"
"trails-server" = "bro._entrypoints:bro_trails_server_server"
"usage" = "bro._entrypoints:bro_llm_usage"
"watch-run" = "bro._entrypoints:bro_watch_run"

[project.entry-points.bro]
bro = "bros.bro:Bro"

[project.entry-points."bro.credential_sources"]
github_app = "bro.extra.github.app:Source"

[project.entry-points."bro.trail_formats"]
claude = "bro.trails.claude_format:CLAUDE_FORMAT"

[project.entry-points."bro.toolsets"]
artifact = "bro.artifact_mcp:toolset"
brog = "bro.brog.mcp:toolset"
file = "bro.files.mcp:toolset"

[tool.bro]
default = "bro-dev"

[tool.bro.devoops]
target-registry = "oops.deploy_targets:registry"

[tool.deptry.package_module_name_map]
python_ulid = ["ulid"]

[tool.deptry.per_rule_ignores]
# Optional UI and extraction modules are activated by engine distributions.
DEP003 = ["humanize", "rich", "textual", "trafilatura"]

[tool.uv.build-backend]
module-root = ""
module-name = ["bro", "bros"]
# both are PEP 420 namespace packages another distribution contributes into
namespace = true
wheel-exclude = [
  "**/*_test.py",
  "**/*_test_helper.py",
  "**/conftest.py",
  "**/AGENTS.md",
  # the backend reads no ignore file, so a build artifact left in a working tree
  # ships unless it is named here
  "**/*.egg-info",
  "bro/setup/setup_env.sh",
  "bro/setup/bump-uv.sh",
  "bro/setup/versions.sh",
  "bro/setup/ubuntu",
]

[tool.pytest.ini_options]
# `bros` is a namespace package spanning two distributions; without this pytest
# names a test module from the first ancestor lacking an __init__.py and lands on
# the wrong dotted path
consider_namespace_packages = true
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "bench", "dev", "local", "harnesses/native/harness", "harnesses/native/trails", "oops", "ride", "browser", "filetypes", "wires/responses", "wires/messages", "wires/chat"]
max_warnings = "0"
markers = [
  "credential_gate: run with the real run-start credential gate (opts out of the conftest autouse fixture that pins it open)",
]

[tool.pyright]
include = ["bro", "bros", "bench", "dev", "local", "harnesses/native/harness", "harnesses/native/trails", "oops", "ride", "browser", "filetypes", "conftest.py", "wires/responses", "wires/messages", "wires/chat"]
# `oops/cdk` type-checks in its own environment, the only one holding the CDK
exclude = ["bro/setup/", ".venv/", "*.egg-info/", "oops/cdk/"]
extraPaths = [".", "bench", "dev", "local", "harnesses/native/harness", "harnesses/native/trails", "oops", "ride", "browser", "filetypes", "wires/responses", "wires/messages", "wires/chat"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py312"
src = [".", "bench", "dev", "local", "harnesses/native/harness", "harnesses/native/trails", "oops", "oops/cdk", "ride", "browser", "filetypes", "benchmark", "wires/responses", "wires/messages", "wires/chat"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "UP", "PIE", "RUF012"]
ignore = ["UP045", "B904"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# a persona declares its components as plain class-level lists and maps,
# wherever the distribution that ships it keeps them
"**/bros/*/*.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "single"
