[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bro"
version = "0.1.0"
description = "agent framework and isolated development workspaces"
readme = "README.md"
requires-python = ">=3.12"
# only what bro.base imports at module load — every heavier surface is pinned by the
# extra that owns it, including the ones bro imports lazily (mcp, boto3)
dependencies = [
  "icecream==2.2.0",
  "python-dateutil==2.9.0.post0",
  "python-ulid==3.1.0",
]

[project.optional-dependencies]
agent = [
  "aiohttp==3.14.1",
  "humanize==4.16.0",
  "mcp==1.28.1",
  "openai==3.0.0",
  "pydantic==2.13.4",
  "rich==15.0.0",
  "textual==8.2.8",
  "trafilatura==2.1.0",
]
aws = [
  "boto3==1.43.40",
]
cw = [
  "humanize==4.16.0",
  "mcp==1.28.1",
  "pydantic==2.13.4",
  "rich==15.0.0",
  "textual==8.2.8",
]
http = [
  "aiohttp==3.14.1",
]
llm = [
  "openai==3.0.0",
  "pydantic==2.13.4",
]
runtime = [
  "mcp==1.28.1",
  "pydantic==2.13.4",
  "starlette==1.3.1",
  "uvicorn==0.49.0",
]
trails-server = [
  "aiohttp==3.14.1",
  "boto3==1.43.40",
]
github = [
  "pyjwt[crypto]==2.12.1",
]

[dependency-groups]
dev = [
  "bro-dev",
  "deptry==0.25.1",
  # starlette.testclient's preferred HTTP client (using httpx 0.x there is deprecated)
  "httpx2==2.10.0",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-aiohttp==1.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.20",
  "types-python-dateutil==2.9.0.20260518",
]

[tool.uv.workspace]
members = ["bro-dev"]

[tool.uv]
# each member's source directory reaches sys.path as a plain path entry; the
# container's baked venv is asserted against that shape
# (bro/setup/container/test_smoke.sh)
config-settings = { editable_mode = "compat" }

[tool.uv.sources]
bro-dev = { workspace = true }

[project.scripts]
# bro
"ask" = "bro._entrypoints:bro_launch_ask"
"bro" = "bro._entrypoints:bro_run"
"bro-shell-dir" = "bro._entrypoints:bro_shell"
"bro.base.credentials" = "bro._entrypoints:bro_base_credentials"
"bro.base.time-util" = "bro._entrypoints:bro_base_time_util"
"bro.broker.broxy" = "bro._entrypoints:bro_broker_broxy"
"bro.broker.cli" = "bro._entrypoints:bro_broker_cli"
"bro.cw.cli" = "bro._entrypoints:bro_cw_cli"
"bro.cw.print-anthropic-key" = "bro._entrypoints:bro_cw_print_anthropic_key"
"bro.cw.statusline" = "bro._entrypoints:bro_cw_statusline"
"bro.extra.github.poll-pr" = "bro._entrypoints:bro_extra_github_poll_pr"
"bro.launch.ask" = "bro._entrypoints:bro_launch_ask"
"bro.launch.call" = "bro._entrypoints:bro_launch_call"
"bro.llm.llm" = "bro._entrypoints:bro_llm_llm"
"bro.llm.usage" = "bro._entrypoints:bro_llm_usage"
"bro.run" = "bro._entrypoints:bro_run"
"bro.runtime.mcp-server" = "bro._entrypoints:bro_runtime_mcp_server"
"bro.shell" = "bro._entrypoints:bro_shell"
"bro.summon" = "bro._entrypoints:bro_summon"
"bro.trails.record.claude" = "bro._entrypoints:bro_trails_record_claude"
"bro.trails.rewind" = "bro._entrypoints:bro_trails_rewind"
"bro.trails.server.server" = "bro._entrypoints:bro_trails_server_server"
"bro.workflow.commit-footer" = "bro._entrypoints:bro_workflow_commit_footer"
"bro.workflow.dive-in" = "bro._entrypoints:bro_workflow_dive_in"
"bro.workflow.land-pr" = "bro._entrypoints:bro_workflow_land_pr"
"broker" = "bro._entrypoints:bro_broker_cli"
"broxy" = "bro._entrypoints:bro_broker_broxy"
"call" = "bro._entrypoints:bro_launch_call"
"commit-footer" = "bro._entrypoints:bro_workflow_commit_footer"
"credentials" = "bro._entrypoints:bro_base_credentials"
"cw" = "bro._entrypoints:bro_cw_cli"
"dive-in" = "bro._entrypoints:bro_workflow_dive_in"
"land-pr" = "bro._entrypoints:bro_workflow_land_pr"
"mcp-server" = "bro._entrypoints:bro_runtime_mcp_server"
"poll-pr" = "bro._entrypoints:bro_extra_github_poll_pr"
"rewind" = "bro._entrypoints:bro_trails_rewind"
"summon" = "bro._entrypoints:bro_summon"
"trails-server" = "bro._entrypoints:bro_trails_server_server"
"usage" = "bro._entrypoints:bro_llm_usage"

[project.entry-points."bro.credential_sources"]
github_app = "bro.extra.github.app:Source"

[project.entry-points."bro.toolsets"]
brog = "bro.brog.mcp:spec"

[tool.bro]
default = "bro-dev"

[tool.deptry.package_module_name_map]
python_ulid = ["ulid"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
include = ["bro*"]
exclude = ["*.egg-info"]

[tool.setuptools.package-data]
"bro.base" = ["registry.json", "hooks/*.sh"]
"bro.bros.bro" = ["scripts/*.md"]
"bro.bros.dev" = ["REFERENCE.md", "scripts/*.md"]
"bro.prompts" = [
  "*.md",
  "*.prompt",
  "*.prompt.template",
  "dev/*.md",
  "fragments/*.md",
  "holds/*.md",
  "shared/*.md",
]
"bro.reference" = ["*.md"]
"bro.setup" = [
  "prelude.sh",
  "log.sh",
  "strict.sh",
  "docker_smoke_test.sh",
  "container/Dockerfile",
  "container/entrypoint.sh",
  "container/git.sh",
  "container/claude-code-version",
  "base_image/Dockerfile",
  "base_image/build.sh",
]
"bro.trails" = ["bootstrap.sh", "server/dynamodb_reserved_words.txt"]
"bro.workflow" = ["hooks/commit-msg", "hooks/post-commit"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "bro-dev"]
max_warnings = "0"
markers = [
  "credential_gate: run with the real run-start credential gate (opts out of the conftest autouse fixture that pins it open)",
]

[tool.pyright]
include = ["bro", "bro-dev/bro_dev", "conftest.py", "dev", "shell_policy_test.py"]
exclude = ["bro/setup/", ".venv/", ".claude/", "*.egg-info/", "build/"]
extraPaths = [".", "bro-dev"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py312"
src = [".", "bro-dev"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "UP", "PIE", "RUF012"]
ignore = ["UP045", "B904"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"bro/bros/*/__init__.py" = ["RUF012"]
"bro-dev/bro_dev/bro.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "single"
