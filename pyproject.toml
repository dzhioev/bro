[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "bro"
version = "0.1.0"
description = "framework for declaring and inspecting specialized agents"
readme = "README.md"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
# what declaring and inspecting a persona costs — every surface that *runs* one is
# pinned by the extra that owns it, including the ones bro imports lazily (mcp, boto3)
dependencies = [
  "icecream==2.2.0",
  "pydantic==2.13.4",
  "python-dateutil==2.9.0.post0",
  "python-ulid==3.1.0",
]

[project.optional-dependencies]
agent = [
  "aiohttp==3.14.1",
  "humanize==4.16.0",
  "mcp==1.28.1",
  "openai==3.0.0",
  "rich==15.0.0",
  "textual==8.2.8",
  "trafilatura==2.1.0",
]
aws = [
  "boto3==1.43.40",
]
ride = [
  "humanize==4.16.0",
  "mcp==1.28.1",
  "rich==15.0.0",
  "textual==8.2.8",
]
http = [
  "aiohttp==3.14.1",
]
llm = [
  "openai==3.0.0",
]
runtime = [
  "mcp==1.28.1",
  "starlette==1.3.1",
  "uvicorn==0.49.0",
]
trails-server = [
  "aiohttp==3.14.1",
  "boto3==1.43.40",
]
github = [
  "pyjwt[crypto]==2.12.1",
]

[dependency-groups]
dev = [
  "bro-dev",
  # local/'s member; must stay a group entry — a [project] dependency would ship it
  "bro-local",
  "deptry==0.25.1",
  # starlette.testclient's preferred HTTP client (using httpx 0.x there is deprecated)
  "httpx2==2.10.0",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-aiohttp==1.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-xdist==3.8.0",
  # a real parser, for the tests that read YAML this repository renders or ships
  "pyyaml==6.0.3",
  "ruff==0.15.20",
  "types-python-dateutil==2.9.0.20260518",
  "types-pyyaml==6.0.12.20260815",
]

[tool.uv.workspace]
members = ["dev", "local", "ride"]

[tool.uv.sources]
bro-dev = { workspace = true }
bro-local = { workspace = true }

[project.scripts]
# bro
"bro" = "bro._entrypoints:bro_run"
"bro-shell-dir" = "bro._entrypoints:bro_shell"
"bro.base.credentials" = "bro._entrypoints:bro_base_credentials"
"bro.base.time-util" = "bro._entrypoints:bro_base_time_util"
"bro.broker.broxy" = "bro._entrypoints:bro_broker_broxy"
"bro.broker.cli" = "bro._entrypoints:bro_broker_cli"
"bro.extra.github.poll-pr" = "bro._entrypoints:bro_extra_github_poll_pr"
"bro.llm.usage" = "bro._entrypoints:bro_llm_usage"
"bro.native.llm" = "bro._entrypoints:bro_native_llm"
"bro.run" = "bro._entrypoints:bro_run"
"bro.runtime.mcp-server" = "bro._entrypoints:bro_runtime_mcp_server"
"bro.shell" = "bro._entrypoints:bro_shell"
"bro.summon" = "bro._entrypoints:bro_summon"
"bro.trails.rewind" = "bro._entrypoints:bro_trails_rewind"
"bro.trails.server.server" = "bro._entrypoints:bro_trails_server_server"
"bro.workflow.commit-footer" = "bro._entrypoints:bro_workflow_commit_footer"
"bro.workflow.fold-branch" = "bro._entrypoints:bro_workflow_fold_branch"
"bro.workflow.land-pr" = "bro._entrypoints:bro_workflow_land_pr"
"broker" = "bro._entrypoints:bro_broker_cli"
"broxy" = "bro._entrypoints:bro_broker_broxy"
"commit-footer" = "bro._entrypoints:bro_workflow_commit_footer"
"credentials" = "bro._entrypoints:bro_base_credentials"
"fold-branch" = "bro._entrypoints:bro_workflow_fold_branch"
"land-pr" = "bro._entrypoints:bro_workflow_land_pr"
"mcp-server" = "bro._entrypoints:bro_runtime_mcp_server"
"poll-pr" = "bro._entrypoints:bro_extra_github_poll_pr"
"rewind" = "bro._entrypoints:bro_trails_rewind"
"summon" = "bro._entrypoints:bro_summon"
"trails-server" = "bro._entrypoints:bro_trails_server_server"
"usage" = "bro._entrypoints:bro_llm_usage"

[project.entry-points.bro]
bro = "bros.bro:Bro"
dev = "bros.dev:Dev"
lead = "bros.lead:Lead"
terminal = "bros.terminal:Terminal"

[project.entry-points."bro.credential_sources"]
github_app = "bro.extra.github.app:Source"

[project.entry-points."bro.toolsets"]
brog = "bro.brog.mcp:toolset"

[tool.bro]
default = "bro-dev"

[tool.bro.analyst]
reports = "dev/bros/analyst/reports"

[tool.deptry.package_module_name_map]
python_ulid = ["ulid"]

[tool.uv.build-backend]
module-root = ""
module-name = ["bro", "bros"]
# both are PEP 420 namespace packages another distribution contributes into
namespace = true
wheel-exclude = [
  "**/*_test.py",
  "**/*_test_helper.py",
  "**/conftest.py",
  "**/AGENTS.md",
  # the backend reads no ignore file, so a build artifact left in a working tree
  # ships unless it is named here
  "**/*.egg-info",
  "bro/setup/setup_env.sh",
  "bro/setup/versions.sh",
  "bro/setup/ubuntu",
]

[tool.pytest.ini_options]
# `bros` is a namespace package spanning two distributions; without this pytest
# names a test module from the first ancestor lacking an __init__.py and lands on
# the wrong dotted path
consider_namespace_packages = true
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "dev", "local", "ride"]
max_warnings = "0"
markers = [
  "credential_gate: run with the real run-start credential gate (opts out of the conftest autouse fixture that pins it open)",
]

[tool.pyright]
include = ["bro", "bros", "dev", "local", "ride", "conftest.py"]
exclude = ["bro/setup/", ".venv/", "*.egg-info/", "build/"]
extraPaths = [".", "dev", "local", "ride"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py312"
src = [".", "dev", "local", "ride", "benchmark"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "UP", "PIE", "RUF012"]
ignore = ["UP045", "B904"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# a persona declares its components as plain class-level lists and maps,
# wherever the distribution that ships it keeps them
"**/bros/*/__init__.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "single"
