[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "bro-browser"
version = "0.1.0"
description = "browser persona and webview worker for bro"
requires-python = ">=3.12"
dependencies = [
  "anyio",
  "bro",
  "bro-ride",
  "mcp==2.3.0",
  "pydantic",
]

[project.scripts]
# bro
"bro.webview.cli" = "bro.webview._entrypoints:bro_webview_cli"
"webview" = "bro.webview._entrypoints:bro_webview_cli"

[project.entry-points."bro.bros.bro"]
browser = "bros.browser:Browser"

[project.entry-points."bro.worker_types"]
webview = "bro.webview.worker:WebviewType"

[project.entry-points."bro.toolsets"]
webview = "bro.webview.mcp:toolset"

[project.entry-points."bro.credentials"]
cookies = "bro.webview.credentials:COOKIES"

[project.entry-points."bro.session_commands"]
webview = "bro.webview._entrypoints:bro_webview_cli"

[tool.uv.sources]
bro = { workspace = true }
bro-ride = { workspace = true }

[tool.deptry.package_module_name_map]
bro = ["bro", "bros"]
bro-ride = ["ride"]

[tool.uv.build-backend]
module-root = ""
module-name = ["bro.webview", "bros.browser"]
namespace = true
wheel-exclude = [
  "**/*_test.py",
  "**/*_test_helper.py",
  "**/conftest.py",
  "**/AGENTS.md",
  "**/*.egg-info",
]
