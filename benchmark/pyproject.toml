[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "bro-benchmark"
version = "0.1.0"
description = "running a bro as an agent under the Harbor benchmark harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3==1.43.114",
  "botocore==1.43.114",
  "bro",
  "bro-bench",
  "bro-ride",
  "bro-claude",
  "bro-native-trails",
  "bro-claude-trails",
  "bro-wire-responses",
  "bro-wire-messages",
  "bro-wire-chat",
  "duckdb==1.5.6",
  "harbor==0.24.0",
]

[dependency-groups]
dev = [
  "pyright==1.1.414",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[project.scripts]
# bro
"benchmark" = "bro.benchmark._entrypoints:bro_benchmark_cli"
"benchmark-harbor-job" = "bro.benchmark._entrypoints:bro_benchmark_job"
"bro.benchmark.bundle" = "bro.benchmark._entrypoints:bro_benchmark_bundle"
"bro.benchmark.cli" = "bro.benchmark._entrypoints:bro_benchmark_cli"
"bro.benchmark.job" = "bro.benchmark._entrypoints:bro_benchmark_job"

[tool.uv.sources]
bro-claude = { path = "../harnesses/claude/harness", editable = true }
bro-claude-trails = { path = "../harnesses/claude/trails", editable = true }
bro-native-trails = { path = "../harnesses/native/trails", editable = true }
bro-wire-responses = { path = "../wires/responses", editable = true }
bro-wire-messages = { path = "../wires/messages", editable = true }
bro-wire-chat = { path = "../wires/chat", editable = true }
bro = { path = "..", editable = true }
bro-bench = { path = "../bench", editable = true }
bro-ride = { path = "../ride", editable = true }

[tool.deptry.package_module_name_map]
bro-claude = ["bro"]
bro-native-trails = ["bro"]
bro-claude-trails = ["bro"]
bro-wire-responses = ["bro"]
bro-wire-messages = ["bro"]
bro-wire-chat = ["bro"]
bro = ["bro", "bros"]
bro-bench = ["bro"]
bro-ride = ["ride"]
# the gate reads this project from the workspace venv, which has no harbor to
# read the module name off
harbor = ["harbor"]

[tool.uv.build-backend]
module-root = ""
module-name = ["bro.benchmark"]
# `bro` is the framework's namespace package; this portion carries no
# __init__.py of its own so the distributions merge
namespace = true
wheel-exclude = ["**/*_test.py", "**/*_test_helper.py", "**/conftest.py", "**/AGENTS.md"]

# no [tool.ruff] table: it would make this project a config root of its own, and
# the repository root's is what formats and lints the directory
[tool.pytest.ini_options]
max_warnings = "0"
asyncio_mode = "auto"

[tool.pyright]
include = ["bro", "conftest.py"]
exclude = [".venv/"]
venvPath = "."
venv = ".venv"
