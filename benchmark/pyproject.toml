[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "bro-benchmark"
version = "0.1.0"
description = "running a bro as an agent under the Harbor benchmark harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3==1.43.40",
  "botocore==1.43.79",
  "bro",
  "bro-ride",
  "harbor==0.21.0",
]

[dependency-groups]
dev = [
  # the session-side `benchmark-job` CLI and the host-side kind it drives, which
  # `benchmark_job_e2e_test` runs the broker path through
  "bro-local",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[project.entry-points."bro.credentials"]
benchmark_retention = "bro.benchmark.credentials:RETENTION"

[project.scripts]
# bro
"benchmark-bundle" = "bro.benchmark._entrypoints:bro_benchmark_bundle"
"benchmark-compare" = "bro.benchmark._entrypoints:bro_benchmark_compare"
"benchmark-harbor-job" = "bro.benchmark._entrypoints:bro_benchmark_job"
"bro.benchmark.bundle" = "bro.benchmark._entrypoints:bro_benchmark_bundle"
"bro.benchmark.compare" = "bro.benchmark._entrypoints:bro_benchmark_compare"
"bro.benchmark.job" = "bro.benchmark._entrypoints:bro_benchmark_job"

[tool.uv.sources]
bro = { path = "..", editable = true }
bro-local = { path = "../local", editable = true }
bro-ride = { path = "../ride", editable = true }

[tool.deptry.package_module_name_map]
bro = ["bro", "bros"]
bro-local = ["bro", "bros"]
bro-ride = ["ride"]
# the gate reads this project from the workspace venv, which has no harbor to
# read the module name off
harbor = ["harbor"]

[tool.uv.build-backend]
module-root = ""
module-name = ["bro.benchmark"]
# `bro` is the framework's namespace package; this portion carries no
# __init__.py of its own so the distributions merge
namespace = true
wheel-exclude = ["**/*_test.py", "**/*_test_helper.py", "**/conftest.py", "**/AGENTS.md"]

# no [tool.ruff] table: it would make this project a config root of its own, and
# the repository root's is what formats and lints the directory
[tool.pytest.ini_options]
max_warnings = "0"
asyncio_mode = "auto"

[tool.pyright]
include = ["bro", "conftest.py"]
exclude = [".venv/"]
venvPath = "."
venv = ".venv"
