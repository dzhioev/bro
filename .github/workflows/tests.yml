name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  stage:
    name: ${{ matrix.stage }}${{ matrix.arch && format(' {0}', matrix.arch) || '' }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }}
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # every stage `run-tests` runs by default, one runner each; the opt-in
        # llm and conformance stages spend tokens and stay out. broker_e2e launches its live
        # scenarios one after another, so it is dealt over shards, a runner each
        stage: [lint, types, unit, benchmark, cdk, docker, webview_e2e]
        include:
          - stage: sandbox
            arch: x86_64
            runner: ubuntu-latest
          - stage: sandbox
            arch: arm64
            runner: ubuntu-24.04-arm
          - stage: broker_e2e
            shard: 1/3
          - stage: broker_e2e
            shard: 2/3
          - stage: broker_e2e
            shard: 3/3
    steps:
      - uses: actions/checkout@v7
      - name: read the uv pin
        id: uv-pin
        run: echo "version=$(cat bro/setup/uv-version)" >> "$GITHUB_OUTPUT"
      # setup-uv publishes no major-version tags from v8 on
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ steps.uv-pin.outputs.version }}
      - name: sync the workspace
        run: uv sync --all-packages --all-groups --all-extras
      - name: run-tests
        run: |
          source .venv/bin/activate
          run-tests --only ${{ matrix.stage }} ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}

  # the branch ruleset requires one check named `tests`; this job is it, and it
  # reports the matrix's aggregate result
  tests:
    needs: stage
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.stage.result }}' = success
