name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  stage:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # every stage `run-tests` names, one runner each
        stage: [lint, types, unit, benchmark, docker, broker_e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: sync the workspace
        run: uv sync --all-packages --all-groups --all-extras
      - name: run-tests
        run: |
          source .venv/bin/activate
          run-tests --only ${{ matrix.stage }}

  # the branch ruleset requires one check named `tests`; this job is it, and it
  # reports the matrix's aggregate result
  tests:
    needs: stage
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.stage.result }}' = success
