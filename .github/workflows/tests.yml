name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # the container smoke test clones this checkout, and `git clone` copies local
      # branches only — a pull_request checkout is a detached HEAD with none, leaving
      # the clone without the origin/master its entrypoint fetches. push runs already
      # have master checked out, and git refuses a fetch into the current branch.
      - if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin +refs/heads/master:refs/heads/master
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --all-groups --all-extras
      - run: |
          source .venv/bin/activate
          run-tests
