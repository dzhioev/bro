[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "bro-wire-chat"
version = "0.1.0"
description = "SDK-free chat wire decoding for bro"
requires-python = ">=3.12"
dependencies = ["bro"]

[project.entry-points."bro.llm.wires"]
chat = "bro.wire_chat.decode"

[tool.uv.sources]
bro = { workspace = true }

[tool.deptry.package_module_name_map]
bro = ["bro"]

[tool.uv.build-backend]
module-root = ""
module-name = ["bro.wire_chat"]
namespace = true
wheel-exclude = ["**/*_test.py", "**/*_test_helper.py", "**/conftest.py", "**/AGENTS.md", "**/*.egg-info"]
