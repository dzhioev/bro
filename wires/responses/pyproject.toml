[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "bro-wire-responses"
version = "0.1.0"
description = "Responses protocol decoding and client for bro"
requires-python = ">=3.12"
dependencies = ["bro"]

[project.optional-dependencies]
client = ["openai==3.33.0", "pydantic==2.14.1"]

[project.entry-points."bro.llm.wire_clients"]
responses = "bro.wire_responses.client:Responses"

[project.entry-points."bro.llm.wires"]
responses = "bro.wire_responses.decode"

[tool.uv.sources]
bro = { workspace = true }

[tool.deptry.package_module_name_map]
bro = ["bro"]

[tool.uv.build-backend]
module-root = ""
module-name = ["bro.wire_responses"]
namespace = true
wheel-exclude = ["**/*_test.py", "**/*_test_helper.py", "**/conftest.py", "**/AGENTS.md", "**/*.egg-info"]
