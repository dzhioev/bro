[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "bro-ride"
version = "0.1.0"
description = "managed-workspace runtime for bro harnesses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bro",
  "humanize==4.16.0",
  "mcp==1.28.1",
  "rich==15.0.0",
  "textual==8.2.8",
]

[project.scripts]
# ride
"ask" = "ride._entrypoints:ride_ask"
"call" = "ride._entrypoints:ride_call"
"dive-in" = "ride._entrypoints:ride_dive_in"
"ride" = "ride._entrypoints:ride_cli"
"ride.ask" = "ride._entrypoints:ride_ask"
"ride.call" = "ride._entrypoints:ride_call"
"ride.claude.print-anthropic-key" = "ride._entrypoints:ride_claude_print_anthropic_key"
"ride.claude.statusline" = "ride._entrypoints:ride_claude_statusline"
"ride.claude.trail-recorder" = "ride._entrypoints:ride_claude_trail_recorder"
"ride.claude.watch-guard" = "ride._entrypoints:ride_claude_watch_guard"
"ride.cli" = "ride._entrypoints:ride_cli"
"ride.dive-in" = "ride._entrypoints:ride_dive_in"

[project.entry-points."bro.session_commands"]
"ride" = "ride._entrypoints:ride_cli"

[project.entry-points."bro.mcp.targets"]
bro = "ride.claude.assembly:resolve_bro_target"
persona = "ride.claude.assembly:resolve_persona_target"

[tool.uv.sources]
bro = { workspace = true }

[tool.deptry.package_module_name_map]
bro = ["bro", "bros"]

[tool.deptry.per_rule_ignores]
# Runtime dependencies imported by core modules that ride's adapters execute.
DEP002 = ["mcp", "rich", "textual"]

[tool.uv.build-backend]
module-root = ""
module-name = ["ride"]
wheel-exclude = [
  "**/*_test.py",
  "**/*_test_helper.py",
  "**/conftest.py",
  "**/AGENTS.md",
  "**/*.egg-info",
  "ride/setup/container/bump-claude-code.sh",
  "ride/setup/container/test_smoke.sh",
]
