[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "bro-ride"
version = "0.1.0"
description = "managed-workspace runtime for bro harnesses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bro",
  "certifi==2026.7.22",
  "humanize==4.16.0",
  "mcp==1.28.1",
  "pyyaml==6.0.3",
  "rich==15.0.0",
  "tree-sitter==0.26.0",
  "tree-sitter-bash==0.25.1",
  "textual==8.2.8",
]

[project.scripts]
# ride
"ask" = "ride._entrypoints:ride_ask"
"call" = "ride._entrypoints:ride_call"
"dive-in" = "ride._entrypoints:ride_dive_in"
"do-ride" = "ride._entrypoints:ride_do_ride"
"ride" = "ride._entrypoints:ride_cli"
"ride.ask" = "ride._entrypoints:ride_ask"
"ride.call" = "ride._entrypoints:ride_call"
"ride.claude.command-gate" = "ride._entrypoints:ride_claude_command_gate"
"ride.claude.read-gate" = "ride._entrypoints:ride_claude_read_gate"
"ride.claude.statusline" = "ride._entrypoints:ride_claude_statusline"
"ride.claude.trail-recorder" = "ride._entrypoints:ride_claude_trail_recorder"
"ride.claude.watch-waiter" = "ride._entrypoints:ride_claude_watch_waiter"
"ride.cli" = "ride._entrypoints:ride_cli"
"ride.dive-in" = "ride._entrypoints:ride_dive_in"
"ride.do-ride" = "ride._entrypoints:ride_do_ride"

[project.entry-points."bro.session_commands"]
"do-ride" = "ride._entrypoints:ride_do_ride"
"ride" = "ride._entrypoints:ride_cli"

[project.entry-points."bro.harnesses"]
claude = "ride.claude.harness:CLAUDE"

[project.entry-points."bro.worker_types"]
bro = "ride.bro_worker:BroType"

[project.entry-points."bro.mcp.targets"]
persona = "ride.claude.assembly:resolve_persona_target"

[tool.uv.sources]
bro = { workspace = true }

[tool.deptry.package_module_name_map]
bro = ["bro", "bros"]

[tool.deptry.per_rule_ignores]
# Runtime dependencies imported by core modules that ride's adapters execute.
DEP002 = ["mcp", "rich", "textual", "tree-sitter", "tree-sitter-bash"]

[tool.uv.build-backend]
module-root = ""
module-name = ["ride"]
wheel-exclude = [
  "**/*_test.py",
  "**/*_test_helper.py",
  "**/conftest.py",
  "**/AGENTS.md",
  "**/*.egg-info",
  "ride/setup/container/bump-claude-code.sh",
  "ride/setup/container/test_smoke.sh",
]
