[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "bro-local"
version = "0.1.0"
description = "the bro framework checkout's own persona and scripts"
requires-python = ">=3.12"
dependencies = [
  "bro",
  "bro-dev",
  "rich",
]

[project.scripts]
# bro
"bro.local.run-tests" = "bro.local._entrypoints:bro_local_run_tests"
"bro.local.syscall-tables" = "bro.local._entrypoints:bro_local_syscall_tables"
"run-tests" = "bro.local._entrypoints:bro_local_run_tests"
"syscall-tables" = "bro.local._entrypoints:bro_local_syscall_tables"

[tool.uv.sources]
bro = { workspace = true }
bro-dev = { workspace = true }

[project.entry-points.bro]
bro-dev = "bros.bro_dev:BroDev"
bro-eyebro = "bros.bro_eyebro:BroEyebro"
bro-watch-probe = "bros.bro_watch_probe:BroWatchProbe"
bro-file-probe = "bros.bro_file_probe:BroFileProbe"

[tool.deptry.package_module_name_map]
bro = ["bro", "bros"]
bro-dev = ["bro", "bros"]

[tool.uv.build-backend]
module-root = ""
module-name = ["bro.local", "bros.bro_dev", "bros.bro_eyebro", "bros.bro_watch_probe", "bros.bro_file_probe"]
# both are namespace packages the framework distribution also ships into; these
# portions carry no __init__.py of their own so they merge
namespace = true
wheel-exclude = [
  "**/*_test.py",
  "**/*_test_helper.py",
  "**/conftest.py",
  "**/AGENTS.md",
  "**/*.egg-info",
]
