version: 0.2

# A build environment carries no credential store, so the image-build script
# takes its target, repository and region from the environment.
phases:
  build:
    commands:
      - set -o pipefail
      - test -n "$TARGET"
      - test -n "$IMAGE_BUILD_SCRIPT"
      - UV_VERSION="$(cat bro/setup/uv-version)"
      - curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
      - export PATH="${XDG_BIN_HOME:-$HOME/.local/bin}:$PATH"
      - test "$(uv --version | awk '{print $2}')" = "$UV_VERSION"
      - uv sync --locked --all-packages
      - uv run "$IMAGE_BUILD_SCRIPT" "$TARGET"
