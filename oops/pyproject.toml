[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "bro-oops"
version = "0.1.0"
description = "deployment infrastructure and operations helpers for bro"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aws-cdk-lib==2.250.0",
  "boto3==1.43.40",
  "bro",
  "bro-dev",
  "constructs==10.6.0",
]

[project.scripts]
# bro
"bro-oops-dir" = "bro.oops._entrypoints:bro_oops_assets"
"bro.oops.assets" = "bro.oops._entrypoints:bro_oops_assets"

[project.entry-points.bro]
devoops = "bros.devoops:Devoops"

[project.entry-points."bro.toolsets"]
infra = "bro.oops.mcp:toolset"

[tool.uv.sources]
bro = { workspace = true }
bro-dev = { workspace = true }

[tool.deptry.package_module_name_map]
bro = ["bro", "bros"]
bro-dev = ["bros"]

[tool.uv.build-backend]
module-root = ""
module-name = ["bro.oops", "bros.devoops"]
namespace = true
wheel-exclude = [
  "**/*_test.py",
  "**/*_test_helper.py",
  "**/conftest.py",
  "**/AGENTS.md",
  "**/*.egg-info",
]
