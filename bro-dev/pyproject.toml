[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bro-dev"
version = "0.1.0"
description = "development tooling for bro framework repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bro[agent]",
]

[tool.uv.sources]
bro = { workspace = true }

[project.scripts]
# bro_dev
"bro-dev.claude-commit-footer" = "bro_dev._entrypoints:bro_dev_claude_commit_footer"
"bro-dev.git-golc" = "bro_dev._entrypoints:bro_dev_git_golc"
"bro-dev.install" = "bro_dev._entrypoints:bro_dev_install"
"bro-dev.sync-scripts" = "bro_dev._entrypoints:bro_dev_sync_scripts"
"bro-dev.usage-report" = "bro_dev._entrypoints:bro_dev_usage_report"
"sync-scripts" = "bro_dev._entrypoints:bro_dev_sync_scripts"
"usage-report" = "bro_dev._entrypoints:bro_dev_usage_report"

[project.entry-points.bro]
bro-dev = "bro_dev.bro:BroDev"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
include = ["bro_dev*"]
exclude = ["*.egg-info"]

[tool.setuptools.package-data]
"bro_dev" = ["hooks/post-commit"]
