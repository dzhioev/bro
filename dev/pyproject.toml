[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "bro-dev"
version = "0.1.0"
description = "development tooling for repositories built on the bro framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bro",
]

[project.scripts]
# bro
"bro.dev.git-golc" = "bro.dev._entrypoints:bro_dev_git_golc"
"bro.dev.install" = "bro.dev._entrypoints:bro_dev_install"
"bro.dev.sync-scripts" = "bro.dev._entrypoints:bro_dev_sync_scripts"
"bro.dev.usage-report" = "bro.dev._entrypoints:bro_dev_usage_report"
"bro.extra.github.poll-pr" = "bro.dev._entrypoints:bro_extra_github_poll_pr"
"bro.workflow.commit-footer" = "bro.dev._entrypoints:bro_workflow_commit_footer"
"bro.workflow.fold-branch" = "bro.dev._entrypoints:bro_workflow_fold_branch"
"bro.workflow.land-pr" = "bro.dev._entrypoints:bro_workflow_land_pr"
"commit-footer" = "bro.dev._entrypoints:bro_workflow_commit_footer"
"fold-branch" = "bro.dev._entrypoints:bro_workflow_fold_branch"
"land-pr" = "bro.dev._entrypoints:bro_workflow_land_pr"
"poll-pr" = "bro.dev._entrypoints:bro_extra_github_poll_pr"
"sync-scripts" = "bro.dev._entrypoints:bro_dev_sync_scripts"
"usage-report" = "bro.dev._entrypoints:bro_dev_usage_report"
# bros
"bros.analyst.scripts.trails-usage" = "bro.dev._entrypoints:bros_analyst_scripts_trails_usage"

[project.entry-points.bro]
analyst = "bros.analyst:Analyst"
dev = "bros.dev:Dev"
lead = "bros.lead:Lead"
terminal = "bros.terminal:Terminal"

[tool.uv.sources]
bro = { workspace = true }

[tool.deptry.package_module_name_map]
bro = ["bro", "bros"]

[tool.uv.build-backend]
module-root = ""
module-name = [
  "bro.dev",
  "bro.extra.github",
  "bro.prompts.dev",
  "bro.workflow",
  "bros.analyst",
  "bros.dev",
  "bros.lead",
  "bros.terminal",
]
# these module roots contribute leaves to package trees shared with `bro`
namespace = true
wheel-exclude = [
  "**/*_test.py",
  "**/*_test_helper.py",
  "**/conftest.py",
  "**/AGENTS.md",
  "**/*.egg-info",
  "bros/analyst/reports",
]
